name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:plugin
      - run: git diff --exit-code -- plugins .claude-plugin .agents
      - run: npm run check
      - run: npm run format:check
      # npm run check already builds dist; skip the prepack rebuild here.
      - run: npm pack --dry-run --ignore-scripts
